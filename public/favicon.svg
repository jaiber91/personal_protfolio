<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>JF</title>
  <!-- Cuadrado amarillo flip-dot con "JF" en tinta, como la marca del header. -->
  <rect width="32" height="32" fill="#ffd23f" />
  <g fill="#111114">
    <!-- J -->
    <rect x="10" y="7" width="5" height="14" />
    <rect x="4" y="20" width="11" height="5" />
    <rect x="4" y="16" width="4" height="9" />
    <!-- F -->
    <rect x="18" y="7" width="5" height="18" />
    <rect x="18" y="7" width="10" height="4.5" />
    <rect x="18" y="14" width="8.5" height="4" />
  </g>
</svg>
